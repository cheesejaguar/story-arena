name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholder values: build-time modules validate their shape, but no
      # network calls are made while compiling. Real deployments get these
      # from the Vercel Marketplace integrations.
      DATABASE_URL: postgres://user:pass@localhost:5432/story_arena
      KV_REST_API_URL: https://example.upstash.io
      KV_REST_API_TOKEN: ci-token
      ADMIN_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      SESSION_COOKIE_SECRET: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      SYSTEM_PROMPT_VERSION: v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm exec tsc --noEmit

      - name: Lint
        run: corepack pnpm lint

      - name: Unit and integration tests
        run: corepack pnpm test

      - name: Production build
        run: corepack pnpm build
